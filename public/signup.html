<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sign Up Page of The Dreamer's Archive">
        <meta name="keywords" content="Sign Up">
        <meta name="author" content="Cabrera L. & Comia H.">
        <link rel="icon" type="image/png" href="../assets/knight.png">
        <link rel="stylesheet" href="../signup.css">
        <title>Sign Up</title>

        <style>
            * {
                font-family:'Times New Roman', Times, serif;
                margin: 0;
                padding: 0;
            }

            body {
                background-image: url(../assets/HPbackground.png);
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
            }

            h1 {
                margin-top: 7rem;
                color: #cb6ce6;
                font-size: 7rem;
            }

            .infobox {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                width: 50%;
                height: 100vh;
                background-color: #151239;
            }

            .cropbox {
                display: inline-block;
                width: 50%;
                height: 100%;
                overflow: hidden;
            }

            button {
                border: none;
                margin-top: -15rem;
                transition-duration: 1s;
                display: block;
                width: 15vw;
                height: 8vh;
                font-size: 2rem;
                color: #e2a9f1;
                background-color: #665691;
                border-radius: 40px;
            }

            .line-break {
                width: 100%;
                height: 0;
            }

            a {
                text-decoration: none;
                color: #e2a9f1;
            }

            button:hover {
                background-color:#cb6ce6;
                width: 17vw;
                height: 10vh;
                font-size: 2.5rem;
                border-radius: 60px;
            }

            .centering {
                margin: auto;
            }

            p {
                display: inline;
            }
        </style>
    </head>

    <body>
        <div class="centering">
            <section class="infobox">
                <h1>Sign Up</h1> <div class="line-break"></div>
                <button type="button"><a href="../index.html">➤ Sign Up</a> </button>
            </section>
        </div>

        <section style="float: right;">
            <div class="cropbox">
                
            </div>
        </section>
    </body>
</html>
