<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Sign Up Page of The Dreamer's Archive">
        <meta name="keywords" content="Sign Up">
        <meta name="author" content="Cabrera L. & Comia H.">
        <link rel="icon" type="image/png" href="../assets/knight.png">
        <link rel="stylesheet" href="../signup.css">
        <title>Sign Up</title>

        <style>
            * {
                font-family:'Times New Roman', Times, serif;
                margin: 0;
                padding: 0;
            }

            body {
                background-image: url(../assets/HPbackground.png);
                background-repeat: no-repeat;
                background-position: center;
                background-size: cover;
            }

            h1 {
                margin-top: 10vh;
                color: #cb6ce6;
                font-size: 8vw;
            }

            .infobox {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                width: 50%;
                height: 100vh;
                background-color: #151239;
            }

            button {
                border: none;
                margin-top: -35vh;
                transition-duration: 1s;
                display: block;
                width: 15vw;
                height: 8vh;
                font-size: 2.5vw;
                color: #e2a9f1;
                background-color: #665691;
                border-radius: 40px;
            }

            .line-break {
                width: 100%;
                height: 0;
            }

            .signupbutton {
                text-decoration: none;
                color: #e2a9f1;
            }

            a {
                color:#cb6ce6;
            }

            button:hover {
                background-color:#cb6ce6;
                width: 17vw;
                height: 10vh;
                font-size: 3vw;
                border-radius: 60px;
            }

            .centering {
                margin: auto;
            }

            p {
                display: inline;
            }

            .labels {
                width: 1.5rem;
                margin-right: 0.5rem;
            }

            input {
                background-color: #151239;
                color: #e2a9f1;
                width: 30vw;
                height: 4vh;
                border-right:none;
                border-top: none;
                border-left: none;
                font-size: 1.2rem;
            }

            fieldset {
                border: none;
            }

            .altlinks {
                margin-top: -25vh;
                margin-left: -11vw;
            }

            .infoboxpt2 {
                display: inline-flex;
                justify-content: center;
                align-items: center;
                font-size: 3vw;
                background-color:#665691;
                width: 30vw;
                height: 60vh;
                opacity: 0.75;
                color:#e2a9f1;
            }   

            h2 {
                margin-left: 1.5vw;
            }

            .formatting {
                display: inline-flex;
            }
        </style>
    </head>

    <body>
        <div class="formatting">
            <div class="centering">
            <section class="infobox">
                <h1>Sign Up</h1> <div class="line-break"></div>

                <form action="register.html" method="get">
                    <fieldset style="margin-top: -5rem">
                        <label> <img src="../assets/username.png" class="labels"> <input type="text" name="uname" id="uname" required /> 
                        <br/><br/>
                        <label> <img src="../assets/password.png" class="labels"> <input type="text" name="password" id="password" required />
                    </fieldset>
                </form>

                <div class="line-break"></div>
                <div class="line-break"></div>

                <nav class="altlinks">
                    <a href="#">Sign in instead?</a>
                    <div class="line-break"></div>
                    <a href="/index.html">Use website without signing up?</a>
                </nav>

                <div class="line-break"></div>
                <button type="button"><a href="../index.html" class="signupbutton">➤ Sign Up</a> </button>
            </section>
        </div>
    </body>
</html>
